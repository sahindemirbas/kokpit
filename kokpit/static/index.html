const base=p=>String(p||"").replace(/\/+$/,"").split("/").pop()||p;

const DS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],DSK=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],ML=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function afIcon(k,sz){const C='<path d="M20 62a18 18 0 0 1 10-33 24 24 0 0 1 46-4 17 17 0 0 1 24 18 12 12 0 0 1-4 19z" fill="#fffaf0" stroke="#161412" stroke-width="3"/>';

 let g='';if(k=='sun')g=SUN(60,48,24);else if(k=='part')g=SUN(88,30,16)+C;else if(k=='fog')g=C+[74,86,98].map((y,i)=>`<line class="af-fog" x1="18" y1="${y}" x2="104" y2="${y}" stroke="#fffaf0" stroke-width="4" stroke-linecap="round" style="animation-delay:${i*.4}s"/>`).join('');
 else if(k=='rain'||k=='storm')g=[24,46,68,90].map((x,i)=>`<line class="af-drop" x1="${x}" y1="70" x2="${x-5}" y2="84" stroke="#fff" stroke-width="4" stroke-linecap="round" style="animation-delay:${i*.27}s"/>`).join('')+(k=='rain'?SUN(88,30,16):'')+C+(k=='storm'?'<path d="M58 60l-10 20h12l-6 18 18-26H60l8-12z" fill="#ffc21a" stroke="#161412" stroke-width="2.5"/>':'');
 else if(k=='snow')g=[26,48,70,92].map((x,i)=>`<circle class="af-drop" cx="${x}" cy="74" r="4" fill="#fff" style="animation-delay:${i*.3}s;animation-duration:2s"/>`).join('')+C;else g=C;
 return `<svg class="ic" width="${sz}" height="${sz}" viewBox="0 0 120 110" aria-hidden="true">${g}</svg>`}
function afScroll(id){const e=$(id);if(e){e.scrollIntoView({behavior:RM?'auto':'smooth',block:'start'});e.focus({preventScroll:true})}}
function afBurst(el){const b=el.getBoundingClientRect();for(let k=0;k<14;k++){const p=document.createElement('i');p.className='af-bu';const a=k/14*6.283;p.style.cssText=`left:${b.left+b.width/2-4}px;top:${b.top+b.height/2-4}px;background:${['#ffc21a','#ff5a3c','#4a9dff','#2fbf71'][k%4]};--x:${Math.cos(a)*56}px;--y:${Math.sin(a)*56}px`;document.body.appendChild(p);setTimeout(()=>p.remove(),700)}}
const NAVT=[['bg','Today'],['ev','Events'],['jb','Career'],['ai','AI usage'],['so','Social'],['br','Brain'],['hl','Health'],['bi','Briefing'],['og','Organiser'],['cn','Connections']],HASH={today:'bg',events:'ev',career:'jb',ai_usage:'ai',social:'so',brain:'br',health:'hl',briefing:'bi',organiser:'og',connections:'cn'},HASHR={bg:'today',ev:'events',jb:'career',ai:'ai_usage',so:'social',br:'brain',hl:'health',bi:'briefing',og:'organiser',cn:'connections'};

legacyHash();try{const o=localStorage.getItem('kokpit_agenda_read');if(o!==null){if(localStorage.getItem('kokpit_briefing_read')===null)localStorage.setItem('kokpit_briefing_read',o);localStorage.removeItem('kokpit_agenda_read')}}catch(e){}

 const t=x=>x==null?'--°':Math.round(x)+'°',DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
 if(!w||!w.days||!w.days.length){const note=w&&w.note?esc(w.note):'run `kokpit run-job weather`',st=w&&w.status?esc(w.status):'not fetched';
  return `<h4>Weather · connection</h4><div class="wxg"><div class="wxc"><div class="wxh"><div><b class="wxn">${w&&w.city?esc(w.city):'Your city'}</b><span class="mono">${st}</span></div></div><div class="wxtp"><div><b>--°</b><span>high</span></div><div class="lo"><b>--°</b><span>low</span></div></div><div class="wxd">Open-Meteo, no API key</div><div class="mono wxp">${note}</div><div class="fc">${na}${na}${na}${na}</div></div></div><div class="mono wxk">Daily high and low, then the next 4 days. Nothing is fetched while the page loads: the weather job fills a local cache.</div>${afFresh(w&&w.freshness)}`}
 const d0=w.days[0],rest=w.days.slice(1,5),st=w.status=='stale'?`stale · ${w.age_hours}h old`:`fetched ${esc((w.fetched||'').slice(11,16))}`;

 const fc=rest.map(d=>`<div><small>${DN[new Date(d.date+'T12:00').getDay()]}</small><b>${t(d.max)}</b><small>${t(d.min)}</small><small>${d.rain_pct!=null?d.rain_pct+'%':'-'}</small></div>`).join('')+na.repeat(Math.max(0,4-rest.length));

function afFresh(f){if(!f)return'';const t=s=>String(s||'').replace('T',' ').slice(0,16);
 if(f.last_status=='never run')return `<p class="mono af-fr">${esc(f.job)}: <b class="af-z">never run</b></p>`;

 return `<h4>Calendar · today <span class="af-st">${age}</span></h4>${c.today.length?`<div style="font:800 25px/1.02 var(--sans);margin:10px 0 6px">${c.today.length} today</div>${c.today.map(row).join('')}`:'<p>Nothing on the calendar today.</p>'}${up||'<p class="mono" style="font-size:11px;margin-top:10px">Nothing in the next 6 days.</p>'}${c.error?`<p class="mono" style="font-size:11px;margin:8px 0 0">${esc(c.error)}</p>`:''}${c.unsupported_rrule?`<p class="mono" style="font-size:10px;margin:6px 0 0">${c.unsupported_rrule} repeating event(s) shown once (rule not supported)</p>`:''}<p class="mono" style="font-size:10px;margin:8px 0 0">Read-only ICS, cached by the calendar job; a stale cache is shown with its age.</p>${afFresh(c.freshness)}`}

const afFail=f=>`${f.job}: failed ${f.streak} runs in a row${f.since?' since '+String(f.since).slice(0,16).replace('T',' '):''}${f.error?' · '+f.error:''}`;

  <div class="af-kp">${K(you.length,'waiting on you','data-bf="you"')}${K(T2,'open tasks','data-scroll="af-today-tasks"')}${K(b?b.threads:0,'active threads','data-view="br"')}${K(b?b.inbox:0,'in inbox','data-view="br"')}${hl&&hl.available?K(hl.jobs,'jobs last night','data-view="hl"'):''}${ev?K(ev.upcoming,'events soon','data-view="ev"'):''}${cr?K(cr.counts.open||0,'open listings','data-view="jb"'):''}${bf?K(bf.count,'briefing items','data-view="bi"'):''}</div></div>`;

  h+=`<div class="af-b af-gd s${bf.audio?8:7}" ${afD(i++)}><h4>Briefing top · ${bf.count}</h4>${bf.top.length?bf.top.map(x=>`<p class="g" data-view="bi"><small>${esc(x.topic||'')}${x.project?' · '+esc(x.project):''} · ${Number(x.score||0).toFixed(1)}${x.by_model?' · model':''}</small>${esc(x.title)}</p>`).join(''):`<p>${esc(bf.reason||'No briefing items today.')}</p>`}<button class="btn" data-view="bi" style="margin-top:8px">All briefing</button>${afFresh(bf.freshness)}</div>`}
 if(cr)h+=`<div class="af-b s4" ${afD(i++)}><h4>Career · ${cr.counts.open||0} open</h4>${cr.top.length?cr.top.map(x=>`<button type="button" class="af-row af-rl" data-view="jb"><span class="tx">${esc(x.title)}${x.company?' · '+esc(x.company):''}</span>${x.score!=null?`<b class="mono">${esc(String(x.score))}</b>`:''}</button>`).join(''):`<p>${esc(cr.reason||'No listings yet.')}</p>`}<button class="btn" data-view="jb" style="margin-top:8px">Open career</button>${afFresh(cr.freshness)}</div>`;
 if(au){const w=au.today,w7=au['7d'],f=x=>x==null?'n/a':Number(x).toLocaleString('en');h+=`<div class="af-b s4" ${afD(i++)}><h4>AI usage · today</h4>${w?`<div style="font:800 40px/1 var(--sans);letter-spacing:-.04em;margin-top:8px"><span data-c="${w.sessions||0}">0</span> <span style="font-size:20px">sessions</span></div><p class="mono" style="margin-top:8px">${f(w.tokens)} tokens${w.estimate_usd!=null?` · ~$${Number(w.estimate_usd).toFixed(2)} (${esc(w.estimate_state||'estimate')})`:''}</p>${w7?`<p class="mono">7 days: ${f(w7.sessions)} sessions · ${f(w7.tokens)} tokens</p>`:''}`:`<p>${esc(au.reason||'No usage data.')}</p>`}<button class="btn" data-view="ai" style="margin-top:8px">Open AI usage</button></div>`}
