const dueTxt=(d,days)=>d?`${esc(d)}${days!=null?(days<0?' · '+Math.abs(days)+'d late':days===0?' · today':' · '+days+'d'):''}`:'';
function afWx(){const na=`<div class="na"><small>-</small><b>-</b><small>-</small><small>-</small></div>`;
 return `<h4>Weather · connection</h4><div class="wxg"><div class="wxc"><div class="wxh"><div><b class="wxn">Your city</b><span class="mono">planned</span></div></div><div class="wxtp"><div><b>--°</b><span>high</span></div><div class="lo"><b>--°</b><span>low</span></div></div><div class="wxd">Open-Meteo, no API key</div><div class="mono wxp">switches on from the Connections screen</div><div class="fc">${na}${na}${na}${na}</div></div></div><div class="mono wxk">Not live yet: a connection, not a module. Daily high and low, then the next 4 days.</div>`}

async function bugunView(){const v=$('view');if(!v.querySelector('.af'))v.innerHTML='<div class="empty">Loading...</div>';
 const d=await J('/api/today');if(S.view!='bg')return;
 const b=d.sections.brain,hl=d.sections.health,td=new Date(d.now);
 const you=b?b.on_you.map(y=>({thread:y.thread,text:esc(y.text)})):[],T2=b?b.open_tasks:0,DT=b?b.upcoming:[];
 let i=0,h=`<div class="af">`;
 const warns=hl&&hl.available?hl.warnings:[];
 if(warns.length)h+=`<div class="af-b af-wr s12" ${afD(i++)}><h4>Warning <span class="af-st">attention</span></h4><ul style="margin:4px 0 0;padding-left:20px">${warns.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;
 h+=`<div class="af-b af-hero s7" ${afD(i++)}>${ring}<h4>${DS[td.getDay()]} ${td.getDate()} ${ML[td.getMonth()]} · your day</h4><h2>${afSplit(afHi(),.25)}</h2>
  <div class="af-kp">${K(you.length,'waiting on you','data-bf="you"')}${K(T2,'open tasks','data-view="br"')}${K(b?b.threads:0,'active threads','data-view="br"')}${K(b?b.inbox:0,'in inbox','data-view="br"')}${hl&&hl.available?K(hl.jobs,'jobs last night','data-view="hl"'):''}</div></div>`;
 h+=`<div class="af-b af-wx s5" ${afD(i++)}>${afWx()}</div>`;
 h+=`<div class="af-b s7" ${afD(i++)}><h4>Waiting on you · ${you.length}</h4>${you.length?you.map(y=>`<button type="button" class="af-row af-rl" data-view="br"><span class="tx">${y.text}</span><i style="background:${afTag(y.thread)}">${esc(y.thread)}</i></button>`).join(''):'<p>Nothing is waiting on you right now.</p>'}</div>`;
 const nd=DT[0],mx=Math.max(30,...DT.map(x=>x.days_left));
 h+=`<div class="af-b af-cd s5" ${afD(i++)}><h4>Upcoming dates</h4>${nd?`<div class="mono" style="margin-top:6px">${esc(nd.text)}</div><div class="n"><span data-c="${nd.days_left}">0</span><span style="font-size:32px;letter-spacing:-.02em"> days</span></div>`:''}
  ${DT.length?DT.map((x,j)=>`<div class="af-dl"><span>${esc(x.text)}</span><b class="mono" style="white-space:nowrap">${esc(x.date)}</b></div><div class="af-pb"><s style="width:${Math.max(4,100-x.days_left/mx*100).toFixed(0)}%;animation-delay:${(.5+j*.1).toFixed(2)}s"></s></div>`).join(''):'<p>No dated items in the notes.</p>'}</div>`;
 h+=`<div class="af-b s4" id="af-tasks" tabindex="-1" ${afD(i++)}><h4>Tasks · ${T2}</h4><div style="font:800 40px/1 var(--sans);letter-spacing:-.04em;margin-top:8px"><span data-c="${T2}">0</span> <span style="font-size:20px">open</span></div><p class="mono" style="margin-top:8px">${b&&b.overdue?`${b.overdue} overdue · `:''}${b?b.threads:0} threads · inbox ${b?b.inbox:0}</p>${b&&!b.vault_exists?'<p>Vault folder not found.</p>':''}<p class="mono" style="font-size:10px;margin:10px 0 0">Tick a box in Brain to mark it done.</p></div>`;
 const ls=b&&b.last_session;
 h+=`<div class="af-b af-tk s4" ${afD(i++)}><div class="l"><h4>Last session · brain</h4>${ls?`<div style="font:800 25px/1.02 var(--sans);margin:10px 0 8px;text-transform:uppercase">${esc(ls.title)}</div><div class="mono">${esc(ls.at)} · ${esc(ls.session)}</div>`:'<p>No session card yet.</p>'}</div><div class="r"><small>${ls?'AT':'DAY'}</small>${ls?esc(String(ls.at).slice(11,16)||String(ls.at).slice(8,10)):td.getDate()}</div></div>`;
 h+=`<div class="af-b af-pd s4" ${afD(i++)}><h4>Health · last night</h4>${hl?hl.available?`<div style="font:800 40px/1 var(--sans);letter-spacing:-.04em;margin-top:8px"><span data-c="${hl.jobs}">0</span> <span style="font-size:20px">jobs</span></div><p class="mono" style="margin-top:8px">${warns.length?warns.length+' warning(s), see above':'all fine today'}</p>`:`<p>${esc(hl.reason)}</p>`:'<p>Module off.</p>'}<button class="btn" data-view="hl" style="margin-top:8px">Open health</button></div>`;
 h+=`<div class="af-b af-gd s5" ${afD(i++)}><h4>Threads · ${b?b.threads:0}</h4>${(b&&b.on_you.length?b.on_you:[]).slice(0,4).map(x=>`<p class="g" data-view="br"><small>${esc(x.thread)}</small>${esc(x.text)}</p>`).join('')}<button class="btn" data-view="br" style="margin-top:8px">All threads</button></div>`;
 h+=`<div class="af-b s7" ${afD(i++)}><h4>Note to brain</h4><textarea id="bnote" rows="4" maxlength="4000" placeholder="Write what is on your mind: an idea, a task, a journal line..."></textarea><div style="display:flex;gap:12px;align-items:center;margin-top:8px;flex-wrap:wrap"><button class="btn" id="bnoteb" onclick="bwNote()" style="background:#ffc21a">Add to inbox</button><span id="bnotes" class="mono" style="font-size:11px">Nothing is rewritten; a new file lands in inbox/.</span></div></div>`;
 v.innerHTML=h+'</div>';counts(v)}
async function bwNote(){const t=$('bnote'),b=$('bnoteb'),s=$('bnotes'),val=t.value.trim();if(!val)return;b.disabled=t.disabled=true;s.textContent='Saving...';
 try{const r=await J('/api/brain/capture',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind:'note',text:val})});s.textContent='saved '+base(r.path);t.value='';afBurst(b)}catch(e){s.textContent=e.message}b.disabled=t.disabled=false}

async function brView(){const v=$('view');v.innerHTML='<div class="empty">Loading...</div>';const d=await J('/api/brain');if(S.view!='br')return;
 if(!d.exists){v.innerHTML=`<div class="empty">Vault not found: ${esc(base(d.vault))}</div>`;return}
 let i=0,h=`<div class="af">`;
 h+=`<div class="af-b s12" style="padding:10px 18px;animation-delay:.05s"><span class="mono">${esc(base(d.vault))} · ${d.files.map(f=>`${esc(f.file)} ${f.exists?`${f.chars}/${f.limit}`:'missing'}`).join(' · ')}</span></div>`;i++;
 const lane=(name,items)=>`<h4 style="margin-top:14px">${name} · ${items.length}</h4>${items.length?items.map(o=>`<div class="af-row"><span class="tx">${esc(o.text)}<span class="mono" style="display:block;font-size:10px;margin-top:2px">${esc(o.thread)}${o.due?' · '+dueTxt(o.due):''}</span></span></div>`).join(''):'<p>Empty.</p>'}`;
 h+=`<div class="af-b s4" ${afD(i++)}><h4>Lanes</h4>${lane('On you',d.lanes.on_you)}${lane('On me',d.lanes.on_me)}${lane('On someone else',d.lanes.others)}</div>`;
 h+=`<div class="af-b s4" id="af-tasks" tabindex="-1" ${afD(i++)}><h4>Tasks · ${d.todo.length}</h4>${d.todo.length?d.todo.map(t=>`<div class="af-row"><span class="af-ck" role="button" title="Mark as done" onclick="afDone(this)"></span><span class="tx">${esc(t.text)}<span class="mono" style="display:block;font-size:10px;margin-top:2px">${dueTxt(t.due,t.days_left)}</span></span></div>`).join(''):'<p>No open tasks in To-Do.md.</p>'}<p class="mono" style="font-size:10px;margin:10px 0 0">Tick the box when it is done.</p></div>`;
 if(d.quick_capture)h+=`<div class="af-b af-hero s4" ${afD(i++)}><h4>Quick capture</h4><form id="cap"><div style="display:flex;gap:8px;margin-bottom:8px"><select name="kind" class="btn" style="padding:6px 10px;font:700 13px var(--sans)"><option value="task">task</option><option value="note">note</option></select><input type="date" name="due" class="btn" style="padding:6px 10px;font:700 13px var(--sans)" title="due (tasks only)"></div><textarea name="text" rows="3" placeholder="One line for a task, anything for a note" required></textarea><div style="display:flex;gap:12px;align-items:center;margin-top:8px;flex-wrap:wrap"><button class="btn">Append</button><span id="capmsg" class="mono" style="font-size:11px"></span></div></form><p class="mono" style="font-size:10px;margin:10px 0 0">A task goes under ## Open in To-Do.md; a note becomes a new file in inbox/.</p></div>`;
 h+=`<div class="af-b af-pd s7" ${afD(i++)}><h4>Sessions · ${d.sessions.length}</h4>${d.sessions.length?d.sessions.map(s=>`<div style="border-top:1.5px solid #fff3d633;padding:10px 0"><div style="font:800 18px/1.1 var(--sans)">${esc(s.title)}</div><div class="mono" style="margin:4px 0 6px">${esc(s.at)} · ${esc(s.session)}</div><div style="font-size:14px">${esc(s.text)}</div></div>`).join(''):'<p>Last-Session.md is empty.</p>'}</div>`;
 h+=`<div class="af-b af-gd s5" ${afD(i++)}><h4>Threads · ${d.threads.length}</h4>${d.threads.length?d.threads.map(t=>`<p class="g"><small>${esc(t.date)}${t.source?' · '+esc(t.source):''}</small>${esc(t.title)}<span style="display:block;font-weight:500;font-size:13.5px;margin-top:3px">${esc(t.status)||'no status line'}</span>${t.open.length?`<span class="mono" style="display:block;margin-top:4px">${t.open.length} open</span>`:''}</p>`).join(''):'<p>No active threads in Threads.md.</p>'}${d.inbox.length?`<p class="mono" style="margin-top:12px">Inbox: ${d.inbox.map(esc).join(', ')}</p>`:''}</div>`;
 v.innerHTML=h+'</div>';counts(v);
 const f=$('cap');if(f)f.onsubmit=async ev=>{ev.preventDefault();const fd=new FormData(f),msg=$('capmsg');
  try{const r=await J('/api/brain/capture',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind:fd.get('kind'),text:fd.get('text'),due:fd.get('due')})});msg.textContent=r.kind==='task'?'appended to To-Do.md':'saved '+base(r.path);f.text.value='';afBurst(f.querySelector('button'));setTimeout(brView,700)}
  catch(e){msg.textContent=e.message}}}
function afDone(el){if(el.classList.contains('dn'))return;el.classList.add('dn');afBurst(el)}

async function hlView(){const v=$('view');v.innerHTML='<div class="empty">Loading...</div>';const d=await J('/api/health');if(S.view!='hl')return;
 if(!d.available){v.innerHTML=`<div class="af"><div class="af-b s12"><p>${esc(d.reason)}</p></div></div>`;return}
 const rows=d.runs.map(r=>`<tr><td><b>${esc(r.job)}</b></td><td>${r.ok?'ok':'error'}</td><td class="mono">${r.rows??'n/a'}</td><td class="mono">${esc(r.finished)}</td><td>${r.warnings.map(esc).join('<br>')||''}${r.ok?'':`<div class="mono">${esc(r.info.error||'')}</div>`}</td></tr>`).join('');
 v.innerHTML=`<div class="af"><div class="af-b s4 ${d.warnings.length?'af-wr':'af-gd'}" ${afD(0)}><h4>Today ${d.warnings.length?'<span class="af-st">attention</span>':''}</h4><div style="font:800 40px/1 var(--sans);letter-spacing:-.04em;margin-top:8px"><span data-c="${d.runs.length}">0</span> <span style="font-size:20px">jobs</span></div>${d.warnings.length?`<ul style="margin:8px 0 0;padding-left:20px">${d.warnings.map(w=>`<li>${esc(w)}</li>`).join('')}</ul>`:'<p>No warnings today.</p>'}</div>
  <div class="af-b s8" ${afD(1)}><h4>Expected before the morning</h4>${d.expected.length?d.expected.map(x=>`<div class="af-row"><span class="af-ck ${d.runs.some(r=>r.job===x&&r.ok)?'dn':''}"></span><span class="tx">${esc(x)}</span></div>`).join(''):'<p>None configured; add names to <code>expected</code> in kokpit.toml.</p>'}</div>
  <div class="af-b s12" ${afD(2)}><h4>Last run per job</h4><table><thead><tr><th>job</th><th>result</th><th>rows</th><th>finished</th><th>warnings</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;counts(v)}

async function evView(){const v=$('view');v.innerHTML='<div class="empty">Loading...</div>';const d=await J('/api/events');if(S.view!='ev')return;
 if(!d.enabled){v.innerHTML=`<div class="af"><div class="af-b s12"><p>Events module is off. Set <code>events = true</code> under [modules] in kokpit.toml.</p></div></div>`;return}
 if(!d.configured){v.innerHTML=`<div class="af"><div class="af-b s12"><p>No place yet. Run <code>kokpit init --city "Your city" --force</code>.</p></div></div>`;return}
 if(d.reason){v.innerHTML=`<div class="af"><div class="af-b s12"><p>${esc(d.reason)}</p></div></div>`;return}
 S.evCat=S.evCat||'';const cats=['',...(d.categories||[])].filter(c=>!c||d.events.some(e=>e.category===c));
 const list=d.events.filter(e=>!S.evCat||e.category===S.evCat);const by=Object.entries(d.counts.by_source||{}).map(([k,n])=>`${esc(k)} ${n}`).join(' · ');
 let i=0,h=`<div class="af"><div class="af-b af-hero s12" ${afD(i++)}><h4>${esc(d.place.city)} · ${d.place.radius_km} km · next ${d.days} days</h4><div style="font:800 40px/1 var(--sans);letter-spacing:-.04em;margin-top:8px"><span data-c="${d.counts.upcoming}">0</span> <span style="font-size:20px">events</span></div><p class="mono" style="font-size:11px;margin:8px 0 0">${by||'no source has run yet'}</p>
 <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:12px">${cats.map(c=>`<button type="button" class="chip${c===S.evCat?' on':''}" data-cat="${esc(c)}" style="--c:${afTag(c||'all')}"><span class="dot"></span>${esc(c||'all')}</button>`).join('')}</div></div>`;
 let day='';for(const e of list){const dd=String(e.start||'').slice(0,10);if(dd!==day){day=dd;const x=ND(dd);h+=`<div class="af-b s12" style="padding:8px 18px" ${afD(i++)}><span class="mono">${DSK[x.getDay()]} ${x.getDate()} ${ML[x.getMonth()]}</span></div>`}
  h+=`<div class="af-b s6" ${afD(i++)}><div class="af-row"><span class="tx"><a href="${esc(e.url||'#')}" target="_blank" rel="noopener">${esc(e.title)}</a><span class="mono" style="display:block;font-size:10px;margin-top:3px">${esc([e.venue,e.city,e.distance_km!=null?Math.round(e.distance_km)+' km':''].filter(Boolean).join(' · '))}</span></span><i style="background:${afTag(e.category)}">${esc(e.category)}</i></div><p class="mono" style="font-size:10px;margin:8px 0 0">${esc(e.source)} · <a href="/api/events/${e.id}.ics">add to calendar</a></p></div>`}
 if(!list.length)h+=`<div class="af-b s12" ${afD(i++)}><p>Nothing in this window. Run <code>kokpit run-job events-collect</code> or check the slugs on Connections.</p></div>`;
 v.innerHTML=h+'</div>';counts(v);v.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{S.evCat=b.dataset.cat;evView()})}

async function cnView(){const v=$('view');v.innerHTML='<div class="empty">Loading...</div>';const d=await J('/api/connections');if(S.view!='cn')return;
 const tone=s=>/^ok$/.test(s)?'af-gd':/planned|off|not set|not created|not run/.test(s)?'':'af-wr';
 const last=l=>l?`${l.ok?'ok':'error'}${l.rows!=null?' · '+l.rows+' rows':''} · ${esc(l.finished)}${l.today?'':' (not today)'}`:'never';
 const groups=['today','brain','health','events','planned'];let i=0,h=`<div class="af"><div class="af-b s12" style="padding:10px 18px" ${afD(i++)}><span class="mono">${esc(d.config)} · what Kokpit reads, with what permission, and when it last worked. Nothing here leaves this machine.</span></div>`;
 for(const g of groups){const items=d.connections.filter(c=>c.module===g);if(!items.length)continue;
  for(const c of items)h+=`<div class="af-b s4 ${tone(c.status)}" ${afD(i++)}><h4>${esc(c.name)} ${c.enabled?'':'<span class="mono" style="font-size:10px">off</span>'}</h4><p class="mono" style="font-size:10px;margin:2px 0 8px">${esc(c.module)} · ${esc(c.kind)}</p><p style="margin:0"><b>reads</b> ${esc(c.reads)}</p><p style="margin:0"><b>writes</b> ${esc(c.writes)}</p><p style="margin:0"><b>permission</b> ${esc(c.permission)}</p><p style="margin:0"><b>target</b> <span class="mono">${esc(c.target)}</span></p>${c.detail?`<p class="mono" style="font-size:10px;margin:6px 0 0">${esc(c.detail)}</p>`:''}<p class="mono" style="font-size:10px;margin:8px 0 0">status ${esc(c.status)} · last ${last(c.last)}</p>${c.last&&c.last.warnings&&c.last.warnings.length?`<p class="mono" style="font-size:10px;margin:4px 0 0">${c.last.warnings.map(esc).join('<br>')}</p>`:''}</div>`}
 v.innerHTML=h+'</div>'}

async function render(){nav();window.scrollTo(0,0);try{await({bg:bugunView,ev:evView,br:brView,hl:hlView,cn:cnView})[S.view]()}catch(e){$('view').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
window.addEventListener('hashchange',()=>{const n=HASH[location.hash.replace('#','')]||'bg';if(n!=S.view){S.view=n;render()}});
J('/api/meta').then(m=>{const t=$('tag');t.hidden=false;t.className='mono';t.style.cssText='font-size:11px';t.textContent=`v${m.version} · ${base(m.config)}`}).catch(()=>{});
afClock();setInterval(afClock,15000);render();
</script>
</body></html>
