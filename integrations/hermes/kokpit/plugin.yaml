name: kokpit
version: "0.7.0"
manifest_version: 2
api_version: 1
description: "Your own cockpit in Hermes: /kokpit setup makes a plain Markdown vault, capture from any chat, a session card and receipt when a session produced a result, so Claude Code, Codex and Hermes continue from the same place. Night pass, morning brief, opt-in news briefing, job listings and a podcast of the briefing. Nothing leaves the machine unless you turn on the briefing (your feeds only), the job search (LinkedIn guest pages), a model option, or make a podcast (the host's text_to_speech tool, or your own notebooklm command)."
author: kokpit
license: MIT
requires_hermes: ">=0.22.0"
tags: [productivity, notes, dashboard]
provides_tools:
  - kokpit_today
  - kokpit_brain_search
  - kokpit_threads
  - kokpit_capture
  - kokpit_events
  - kokpit_jobs
  - kokpit_ai_usage
  - kokpit_health
  - kokpit_training
  - kokpit_server
  - kokpit_night
  - kokpit_briefing
  - kokpit_market
  - kokpit_podcast
provides_hooks:
  - pre_llm_call
  - post_tool_call
  - on_session_start
  - on_session_finalize
  - post_compaction
config_schema:
  kokpit_config:
    type: str
    default: ""
    description: "Path to kokpit.toml. Empty: ./kokpit.toml, then ~/.config/kokpit/kokpit.toml (KOKPIT_CONFIG wins when set)."
  vault_path:
    type: str
    default: ""
    description: "Markdown vault. /kokpit setup writes this for you. Empty: [brain] vault_path from kokpit.toml."
  db_path:
    type: str
    default: ""
    description: "Kokpit SQLite database, opened read-only. Empty: [health] db_path from kokpit.toml. Works without kokpit.toml."
  threads_file:
    type: str
    default: ""
    description: "Threads file, vault-relative (Companion/Threads.md) or absolute. Empty: Threads.md at the vault root, else the single match found in the vault."
  todo_file:
    type: str
    default: ""
    description: "To-Do file, vault-relative or absolute. Empty: To-Do.md at the root, else the single match in the vault."
  last_session_file:
    type: str
    default: ""
    description: "Last-Session file for session cards, vault-relative or absolute. Empty: Last-Session.md at the root, else the single match in the vault."
  receipts_dir:
    type: str
    default: ""
    description: "Folder for session receipts, vault-relative or absolute. Empty: receipts/ in the vault."
  inbox_dir:
    type: str
    default: ""
    description: "Folder for captured notes, vault-relative or absolute. Empty: inbox/ in the vault."
  context_max_chars:
    type: int
    default: 1200
    description: "Budget for the brain context block added to a turn. 0 turns it off."
  expected:
    type: list
    default: []
    description: "Job names kokpit_health expects in the runs table, e.g. [\"weather\", \"calendar\"]. Empty uses [health] expected from kokpit.toml."
  session_card:
    type: bool
    default: true
    description: "Write a Last-Session card and a short receipt into the vault when a session produced a result (capture, file written, accepted proposal, /kokpit done). Chat-only sessions write nothing."
  demo:
    type: str
    default: "auto"
    description: "auto, on or off. auto uses the bundled demo when no Kokpit config and no vault are found."
  training:
    type: bool
    default: false
    description: "Turn on the optional kokpit_training module (reads training logs only)."
  training_logs:
    type: list
    default: []
    description: "Glob list of JSONL or CSV training log files, e.g. [\"~/runs/*/metrics.jsonl\"]."
  training_stall_minutes:
    type: int
    default: 30
    description: "Minutes without a new step before a run is flagged as may have stopped."
  server:
    type: bool
    default: false
    description: "Turn on the optional kokpit_server module (disk, temperature, load, memory, uptime, user services)."
  server_paths:
    type: list
    default: ["/"]
    description: "Paths whose disk usage kokpit_server reports."
  server_units:
    type: list
    default: []
    description: "systemd --user units to check with systemctl --user is-active (names are validated)."
  journal_dir:
    type: str
    default: "daily"
    description: "Vault folder for journal lines (/kokpit j, kokpit_capture kind journal): one YYYY-MM-DD.md per day."
  news_dir:
    type: str
    default: "news"
    description: "Vault folder of Markdown news items the night pass matches to projects when the Kokpit database has no briefing table."
  stale_days:
    type: int
    default: 7
    description: "Days without a change before the night pass proposes a next step for a thread."
  news_days:
    type: int
    default: 2
    description: "How many days back the night pass looks at news items, inbox notes and journal lines."
  night_auto:
    type: bool
    default: false
    description: "Run the night pass in the background when a session starts, at most once every 20 hours."
  night_model:
    type: bool
    default: false
    description: "Also ask the host model (ctx.llm) for proposals. Off by default; every model proposal must quote a real vault file word for word or it is dropped."
  briefing:
    type: bool
    default: false
    description: "Turn on the optional news briefing. Off by default. When on, kokpit_briefing collect, /kokpit news run and hermes kokpit-collect fetch only the feed URLs in briefing_topics; nothing else goes to the network."
  briefing_topics:
    type: list
    default: []
    description: "Topics for the news briefing, each {name, feeds: [http(s) feed URLs], keywords: [optional words]}. /kokpit news add <topic> <feed-url> [keywords...] writes this for you. At most 8 topics, 5 feeds each."
  briefing_max_items:
    type: int
    default: 30
    description: "Most briefing items kept per day (1 to 100), spread over the topics, one headline per topic."
  collect_auto:
    type: bool
    default: false
    description: "Collect in the background when a session starts: every enabled collecting module (news briefing; job listings when jobs and jobs_linkedin are on) whose last good run is older than 20 hours. For Hermes installs where plugin CLI commands are not available. Off by default; with it off, session start makes no network call."
  briefing_model:
    type: bool
    default: false
    description: "Summarise briefing items with the host model (ctx.llm) in one bounded call per collection. Off by default: summaries are then the first sentences of the feed's own text."
  jobs:
    type: bool
    default: false
    description: "Turn on the optional job listings module (kokpit_jobs, kokpit_market). Off by default. An explicit false turns it off even when kokpit.toml enables it. Reading never fetches; collecting also needs jobs_linkedin."
  jobs_linkedin:
    type: bool
    default: false
    description: "Let kokpit_jobs collect and /kokpit jobs run search LinkedIn's public guest job pages (logged out, no login) for the target roles in your profile. LinkedIn's User Agreement restricts automated access: use is at your own risk, it can break or be blocked at any time, and the plugin does not work around a block (the first HTTP 429 or 999 stops the run). Off by default."
  jobs_close_days:
    type: int
    default: 3
    description: "A plugin-collected listing not seen for this many days is marked closed, but only after a run in which its source returned results (1 to 60)."
  podcast:
    type: bool
    default: false
    description: "Turn on the optional podcast of the day's briefing (kokpit_podcast, /kokpit podcast). Off by default. An explicit false turns it off even when kokpit.toml enables it. Needs briefing items for the day; a podcast is made only on an explicit make, never by collect_auto."
  podcast_engine:
    type: str
    default: "tts"
    description: "tts or notebooklm; any other value is refused. tts: the host's own text_to_speech tool with your Hermes TTS voice and provider (the text goes wherever that provider sends it). notebooklm: a source pack (source.md, focus.txt) to add to NotebookLM by hand, automated only with podcast_notebooklm_cli. No fallback between them."
  podcast_model:
    type: bool
    default: false
    description: "Write a two-speaker script with the host model (ctx.llm), one bounded call per topic (at most 8). Off by default: a single-narrator script is built by rule from the stored titles and summaries. Any model failure gives the rules script for the whole episode. The tts engine reads both speakers with its one configured voice; speaker labels are not read aloud."
  podcast_minutes:
    type: int
    default: 8
    description: "Target length in minutes for the model-written script (2 to 30). The rules script reads every item and is as long as it is."
  podcast_language:
    type: str
    default: "en"
    description: "Language the model-written script is written in and the language named in the NotebookLM focus text and passed to the notebooklm command (a code such as en or it). The rules script is English."
  podcast_notebooklm_cli:
    type: bool
    default: false
    description: "Let the plugin run your own notebooklm command (the unofficial notebooklm-py project, which you install and log in to yourself) to create a notebook, add source.md, generate the audio overview and download it. It uses your own Google session, is not supported by Google and can break at any time: use is at your own risk. The plugin does not log in for you, never reads the tool's login files and does not retry around a failure. Off by default."
  podcast_keep_days:
    type: int
    default: 14
    description: "Episode folders older than this many days (1 to 90) are removed from <plugin data dir>/podcast/ at the start of a make; only folders named YYYY-MM-DD there are touched."
