name: kokpit
version: "0.2.0"
manifest_version: 2
api_version: 1
description: "Kokpit for Hermes: read your Kokpit day, brain vault, events, job listings, AI usage and job health (plus optional training-run and server status), capture notes and tasks, and keep a session card."
author: kokpit
license: MIT
requires_hermes: ">=0.22.0"
tags: [productivity, notes, dashboard]
provides_tools:
  - kokpit_today
  - kokpit_brain_search
  - kokpit_threads
  - kokpit_capture
  - kokpit_events
  - kokpit_jobs
  - kokpit_ai_usage
  - kokpit_health
  - kokpit_training
  - kokpit_server
provides_hooks:
  - pre_llm_call
  - post_tool_call
  - on_session_finalize
  - post_compaction
config_schema:
  kokpit_config:
    type: str
    default: ""
    description: "Path to kokpit.toml. Empty: ./kokpit.toml, then ~/.config/kokpit/kokpit.toml (KOKPIT_CONFIG wins when set)."
  vault_path:
    type: str
    default: ""
    description: "Markdown vault. Empty: [brain] vault_path from kokpit.toml."
  db_path:
    type: str
    default: ""
    description: "Kokpit SQLite database, opened read-only. Empty: [health] db_path from kokpit.toml. Works without kokpit.toml."
  threads_file:
    type: str
    default: ""
    description: "Threads file, vault-relative (Companion/Threads.md) or absolute. Empty: Threads.md at the vault root, else the single match found in the vault."
  todo_file:
    type: str
    default: ""
    description: "To-Do file, vault-relative or absolute. Empty: To-Do.md at the root, else the single match in the vault."
  last_session_file:
    type: str
    default: ""
    description: "Last-Session file for session cards, vault-relative or absolute. Empty: Last-Session.md at the root, else the single match in the vault."
  receipts_dir:
    type: str
    default: ""
    description: "Folder for session receipts, vault-relative or absolute. Empty: receipts/ in the vault."
  inbox_dir:
    type: str
    default: ""
    description: "Folder for captured notes, vault-relative or absolute. Empty: inbox/ in the vault."
  context_max_chars:
    type: int
    default: 1200
    description: "Budget for the brain context block added to a turn. 0 turns it off."
  expected:
    type: list
    default: []
    description: "Job names kokpit_health expects in the runs table, e.g. [\"weather\", \"calendar\"]. Empty uses [health] expected from kokpit.toml."
  session_card:
    type: bool
    default: true
    description: "Write a Last-Session card and a receipt into the vault when a session ends."
  demo:
    type: str
    default: "auto"
    description: "auto, on or off. auto uses the bundled demo when no Kokpit config and no vault are found."
  training:
    type: bool
    default: false
    description: "Turn on the optional kokpit_training module (reads training logs only)."
  training_logs:
    type: list
    default: []
    description: "Glob list of JSONL or CSV training log files, e.g. [\"~/runs/*/metrics.jsonl\"]."
  training_stall_minutes:
    type: int
    default: 30
    description: "Minutes without a new step before a run is flagged as may have stopped."
  server:
    type: bool
    default: false
    description: "Turn on the optional kokpit_server module (disk, temperature, load, memory, uptime, user services)."
  server_paths:
    type: list
    default: ["/"]
    description: "Paths whose disk usage kokpit_server reports."
  server_units:
    type: list
    default: []
    description: "systemd --user units to check with systemctl --user is-active (names are validated)."
