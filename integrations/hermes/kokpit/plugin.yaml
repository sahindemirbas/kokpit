name: kokpit
version: "0.4.0"
manifest_version: 2
api_version: 1
description: "Your own cockpit in Hermes: /kokpit setup makes a plain Markdown vault, capture notes and tasks from any chat, a session card and a short receipt only when a session produced a result, so Claude Code, Codex and Hermes continue from the same place. Night pass with quoted sources, morning brief. Local, no network, no model by default."
author: kokpit
license: MIT
requires_hermes: ">=0.22.0"
tags: [productivity, notes, dashboard]
provides_tools:
  - kokpit_today
  - kokpit_brain_search
  - kokpit_threads
  - kokpit_capture
  - kokpit_events
  - kokpit_jobs
  - kokpit_ai_usage
  - kokpit_health
  - kokpit_training
  - kokpit_server
  - kokpit_night
provides_hooks:
  - pre_llm_call
  - post_tool_call
  - on_session_start
  - on_session_finalize
  - post_compaction
config_schema:
  kokpit_config:
    type: str
    default: ""
    description: "Path to kokpit.toml. Empty: ./kokpit.toml, then ~/.config/kokpit/kokpit.toml (KOKPIT_CONFIG wins when set)."
  vault_path:
    type: str
    default: ""
    description: "Markdown vault. /kokpit setup writes this for you. Empty: [brain] vault_path from kokpit.toml."
  db_path:
    type: str
    default: ""
    description: "Kokpit SQLite database, opened read-only. Empty: [health] db_path from kokpit.toml. Works without kokpit.toml."
  threads_file:
    type: str
    default: ""
    description: "Threads file, vault-relative (Companion/Threads.md) or absolute. Empty: Threads.md at the vault root, else the single match found in the vault."
  todo_file:
    type: str
    default: ""
    description: "To-Do file, vault-relative or absolute. Empty: To-Do.md at the root, else the single match in the vault."
  last_session_file:
    type: str
    default: ""
    description: "Last-Session file for session cards, vault-relative or absolute. Empty: Last-Session.md at the root, else the single match in the vault."
  receipts_dir:
    type: str
    default: ""
    description: "Folder for session receipts, vault-relative or absolute. Empty: receipts/ in the vault."
  inbox_dir:
    type: str
    default: ""
    description: "Folder for captured notes, vault-relative or absolute. Empty: inbox/ in the vault."
  context_max_chars:
    type: int
    default: 1200
    description: "Budget for the brain context block added to a turn. 0 turns it off."
  expected:
    type: list
    default: []
    description: "Job names kokpit_health expects in the runs table, e.g. [\"weather\", \"calendar\"]. Empty uses [health] expected from kokpit.toml."
  session_card:
    type: bool
    default: true
    description: "Write a Last-Session card and a short receipt into the vault when a session produced a result (capture, file written, accepted proposal, /kokpit done). Chat-only sessions write nothing."
  demo:
    type: str
    default: "auto"
    description: "auto, on or off. auto uses the bundled demo when no Kokpit config and no vault are found."
  training:
    type: bool
    default: false
    description: "Turn on the optional kokpit_training module (reads training logs only)."
  training_logs:
    type: list
    default: []
    description: "Glob list of JSONL or CSV training log files, e.g. [\"~/runs/*/metrics.jsonl\"]."
  training_stall_minutes:
    type: int
    default: 30
    description: "Minutes without a new step before a run is flagged as may have stopped."
  server:
    type: bool
    default: false
    description: "Turn on the optional kokpit_server module (disk, temperature, load, memory, uptime, user services)."
  server_paths:
    type: list
    default: ["/"]
    description: "Paths whose disk usage kokpit_server reports."
  server_units:
    type: list
    default: []
    description: "systemd --user units to check with systemctl --user is-active (names are validated)."
  journal_dir:
    type: str
    default: "daily"
    description: "Vault folder for journal lines (/kokpit j, kokpit_capture kind journal): one YYYY-MM-DD.md per day."
  news_dir:
    type: str
    default: "news"
    description: "Vault folder of Markdown news items the night pass matches to projects when the Kokpit database has no briefing table."
  stale_days:
    type: int
    default: 7
    description: "Days without a change before the night pass proposes a next step for a thread."
  news_days:
    type: int
    default: 2
    description: "How many days back the night pass looks at news items, inbox notes and journal lines."
  night_auto:
    type: bool
    default: false
    description: "Run the night pass in the background when a session starts, at most once every 20 hours."
  night_model:
    type: bool
    default: false
    description: "Also ask the host model (ctx.llm) for proposals. Off by default; every model proposal must quote a real vault file word for word or it is dropped."
