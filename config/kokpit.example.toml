# Example Kokpit configuration. All values are fictional examples.
# Copy to kokpit.toml and edit. Secrets go to .env, never here.

[place]
city = "Ghent"                # geocoded once on `kokpit init`
country = "BE"                # derived from geocoding, editable
provinces = ["VOV", "VWV"]    # neighbouring provinces to include in events
radius_km = 40
weather_cities = ["Ghent", "Brussels"]

[language]
ui = "en"                     # dashboard language
translate_to = "en"           # translate event text to this language; "" = off
classify = "en"               # keyword language pack for event categories

[modules]
today = true
brain = true
events = true
career = false
social = false
ai_usage = false
briefing = false
organiser = false
bot = false

[today]
# Read-only calendar feeds (ICS). A Google "secret address in iCal format" is a
# secret: put real addresses only in your local, git-ignored kokpit.toml, or in
# the KOKPIT_CALENDAR_ICS_URLS environment variable (space-separated).
calendar_ics_urls = []        # e.g. ["https://calendar.example.org/feeds/<secret>/basic.ics"]

# Night organiser (set organiser = true under [modules]). Runs at 03:30. It never edits or deletes a note:
# it writes proposals to SQLite and one report file in the data folder.
# [organiser]
# stale_days = 30
# types = ["idea", "project", "note", "person", "reference"]
# required_fields = ["type", "summary"]
# short_summary = 20
# apply_report_to_vault = false   # true: one new file Organiser/organiser-report.md inside the vault
# report_folder = "Organiser"
# todo_undated_days = 14          # an open task with no due: date and an older ISO date on its line or heading
# max_notes = 20                  # model on ([model.uses] night): at most this many notes sent in full
# max_chars = 4000                # model on: characters sent per note
# [organiser.folders]
# project = "projects"

# Briefing digest (set briefing = true under [modules]). Daily job `briefing` at 06:45. Nothing is built in:
# remove the leading # and put your own topics, feeds and interests here.
# [briefing]
# max_per_topic = 5            # items kept per topic (1 to 20)
# max_age_days = 7             # older feed entries are ignored
# [[briefing.topics]]
# name = "open source releases"
# feeds = ["https://example.org/releases.atom"]
# keywords = ["release", "security", "python"]
# [briefing.github]              # optional: new repositories by search query; off until queries are set
# queries = ["topic:llm", "static site generator"]
# language = "python"          # optional language filter
# created_days = 30            # only repositories created in the last N days
# max_items = 5
# token_env = "KOKPIT_GITHUB_TOKEN"   # optional token from the environment; works without one
# [briefing.huggingface]         # optional: models by search term and/or the daily papers list
# models = ["text-to-speech"]
# papers = false
# max_items = 5
# [briefing.tts]                 # optional audio summary; the key is read from the environment only
# provider = "none"            # "none" (browser speech) | "openai_compatible"
# base_url = "https://provider.example/v1"
# model = ""
# voice = ""
# key_env = "KOKPIT_TTS_API_KEY"
# [briefing.podcast]             # optional two-voice podcast, off by default; also needs [model.uses] podcast = true
# enabled = false
# tts_provider = "gemini"      # "gemini" or "openai_compatible" (one request per line, no request limit)
# max_turns_per_request = 12   # Gemini: lines per request
# max_turns_stretch = 16       # Gemini: lines per request allowed when max_requests would not fit otherwise
# max_requests = 10            # Gemini: requests for the whole episode (free tier is about 10 TTS requests a day)
# Model summaries and diagrams are a separate opt-in: [model] enabled = true and [model.uses] digest = true.

[brain]
vault_path = "~/Notes"        # Markdown folder; starter structure created if empty
quick_capture = true          # allow appending notes/tasks from the dashboard
meetings_write = true         # false: Brain > Meetings is read-only (saving answers returns 403)

# Brain > Meetings: answer the question lists of a note from the dashboard.
# Kokpit reads the bullet lines under the listed headings and writes your answers
# into one marked section at the end of the same note (data/backups/meetings/ keeps copies).
# [[brain.meetings]]
# id = "garden-timer-review"                                  # [a-z0-9-], at most 40 characters
# title = "Garden timer: review with the supplier"
# source = "notes/garden-timer-review.md"                     # relative to vault_path
# sections = ["## Questions for the supplier", "## Open decisions"]

[events]
sources = ["allevents", "eventbrite"]   # chosen by country; edit to taste
allevents_slug = "gent-be"    # confirm on the Connections screen
eventbrite_slug = "belgium--gent"
adapters = []                 # adapter ids to enable, e.g. ["example-city"]; all off by default
adapter_dirs = []             # your own adapter folders, e.g. ["~/kokpit-adapters/events"]

[career]
cv_path = "~/Documents/cv.pdf"
target_roles = ["Data Analyst", "BI Developer"]
locations = ["Ghent", "Remote"]
remote = "hybrid"             # remote | hybrid | onsite | any
must_have = ["SQL", "Python"]
nice_to_have = ["Power BI", "dbt"]
# Optional browser sources (off by default). Needs `pip install playwright` and a local Chromium
# (system package, or `playwright install chromium` with browser_executable pointing at it).
# browser_sources = ["indeed", "jooble"]   # sites follow [place] country
# browser_executable = ""       # empty = chromium, chromium-browser or google-chrome on PATH
# browser_pages = 2             # result pages per search (1-5)
# browser_delay_s = 2.5         # pause between pages, seconds (1-10)
# browser_detail = true         # open posting pages for the full text; false = card summary only
# browser_max_fails = 2         # consecutive errors or blocks that stop a source for the run
# browser_max_detail = 20       # posting pages per source and run

[social]
analyse = false
publish = false               # separate from analyse; requires an approval per item

[ai_usage]
readers = []                  # e.g. ["hermes", "claude_code", "codex"]

[bot]                         # Telegram bot, used only when bot = true under [modules]
# token = ""                  # or set KOKPIT_TELEGRAM_TOKEN in the environment (preferred)
chat_id = ""                  # the one chat the bot answers; every other chat is ignored
morning_time = "07:30"        # `kokpit bot poll` sends the morning line once a day after this time
poll_timeout = 25             # long poll seconds (1 to 50)

[server]
host = "127.0.0.1"
port = 8501
