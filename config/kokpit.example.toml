# Example Kokpit configuration. All values are fictional examples.
# Copy to kokpit.toml and edit. Secrets go to .env, never here.

[place]
city = "Lodi"                 # geocoded once on `kokpit init`
country = "IT"                # derived from geocoding, editable
provinces = ["LO", "MI", "CR"]  # neighbouring provinces to include in events
radius_km = 40
weather_cities = ["Lodi", "Istanbul"]

[language]
ui = "en"                     # dashboard language
translate_to = "en"           # translate event text to this language; "" = off
classify = "it"               # keyword language pack for event categories

[modules]
today = true
brain = true
events = true
career = false
social = false
ai_usage = false
agenda = false
bot = false

[today]
# Read-only calendar feeds (ICS). A Google "secret address in iCal format" is a
# secret: put real addresses only in your local, git-ignored kokpit.toml, or in
# the KOKPIT_CALENDAR_ICS_URLS environment variable (space-separated).
calendar_ics_urls = []        # e.g. ["https://calendar.example.org/feeds/<secret>/basic.ics"]

[brain]
vault_path = "~/Notes"        # Markdown folder; starter structure created if empty
quick_capture = true          # allow appending notes/tasks from the dashboard

[events]
sources = ["allevents", "eventbrite", "sagramap"]   # chosen by country; edit to taste
allevents_slug = "lodi-it"    # confirm on the Connections screen
eventbrite_slug = "italy--lodi"
adapters = []                 # adapter ids to enable, e.g. ["example-city"]; all off by default
adapter_dirs = []             # your own adapter folders, e.g. ["~/kokpit-adapters/events"]

[career]
cv_path = "~/Documents/cv.pdf"
target_roles = ["Data Analyst", "BI Developer"]
locations = ["Milan", "Remote"]
remote = "hybrid"             # remote | hybrid | onsite | any
must_have = ["SQL", "Python"]
nice_to_have = ["Power BI", "dbt"]

[social]
analyse = false
publish = false               # separate from analyse; requires an approval per item

[ai_usage]
readers = []                  # e.g. ["hermes", "claude_code", "codex"]

[bot]                         # Telegram bot, used only when bot = true under [modules]
# token = ""                  # or set KOKPIT_TELEGRAM_TOKEN in the environment (preferred)
chat_id = ""                  # the one chat the bot answers; every other chat is ignored
morning_time = "07:30"        # `kokpit bot poll` sends the morning line once a day after this time
poll_timeout = 25             # long poll seconds (1 to 50)

[server]
host = "127.0.0.1"
port = 8501
